name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12 \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            python3 python3-pip
          
      - name: Setup vcpkg
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.28'
      
      - name: Configure
        run: |
          cd engines/twilight-elysium
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja ..
      
      - name: Build Engine
        run: |
          cd engines/twilight-elysium/build
          ninja
      
      - name: Build Remakes
        run: |
          for r in kingdom-hearts-zero te-bonfire loz-majoras-mask; do
            cd ../../remakes/$r
            mkdir build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -G Ninja ..
            ninja
            cd ../..
          done
      
      - name: Run Tests
        run: |
          ./engines/twilight-elysium/build/te-test --bounded
          ./remakes/kingdom-hearts-zero/build/khz-combat-test
          ./remakes/te-bonfire/build/te-bonfire --sim
          ./remakes/loz-majoras-mask/build/mm --core

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2
      - name: Configure
        run: |
          cd engines/twilight-elysium
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
      - name: Build
        run: |
          cd engines/twilight-elysium/build
          cmake --build . --config Release
      - name: Test
        run: |
          ./Release/te-test.exe --bounded

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install cmake ninja sdl2 sdl2_image sdl2_mixer sdl2_ttf
      - name: Configure & Build
        run: |
          cd engines/twilight-elysium
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja ..
          ninja
      - name: Test
        run: ./engines/twilight-elysium/build/te-test --bounded
